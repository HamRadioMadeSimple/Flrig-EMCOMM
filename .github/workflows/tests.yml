# Runs the tests on every push and pull request.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tk and a virtual screen
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Run the tests
        run: xvfb-run -a python3 -m unittest discover -s tests -v
